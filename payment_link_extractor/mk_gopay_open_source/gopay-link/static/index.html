<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoPay 批量提链</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">G</span>
        <h1>GoPay 批量提链</h1>
      </div>
      <div class="header-status">
        <span class="policy-badge">拒绝 oaics_</span>
        <div class="status-chip" id="statusChip" data-state="idle">
          <span class="status-dot"></span>
          <span id="statusText">待机</span>
        </div>
      </div>
    </div>
  </header>

  <main class="workspace">
    <section class="config-panel" aria-labelledby="configTitle">
      <div class="section-heading">
        <div>
          <h2 id="configTitle">批量配置</h2>
          <span class="route-badge">ID / IDR / GoPay</span>
        </div>
      </div>

      <form id="taskForm" autocomplete="off" novalidate>
        <div class="field">
          <div class="label-row">
            <label for="tokensInput">Access Token</label>
            <span id="tokenCount" class="field-meta">0 个账号</span>
          </div>
          <textarea id="tokensInput" class="input textarea textarea-tokens mono" rows="9" autocomplete="off" spellcheck="false" placeholder="每行一个 AT，也支持 JSON 数组" required></textarea>
        </div>

        <div class="field">
          <div class="label-row">
            <label for="proxyInput">代理池</label>
            <span id="proxyCount" class="field-meta">0 条</span>
          </div>
          <textarea id="proxyInput" class="input textarea mono" rows="6" spellcheck="false" placeholder="每行一条代理" required></textarea>
        </div>

        <div class="parameter-grid">
          <div class="field">
            <label for="proxySchemeInput">代理协议</label>
            <select id="proxySchemeInput" class="input">
              <option value="auto">自动识别</option>
              <option value="socks5">SOCKS5</option>
              <option value="socks5h">SOCKS5H</option>
              <option value="http">HTTP</option>
              <option value="https">HTTPS</option>
            </select>
          </div>
          <div class="field">
            <label for="concurrencyInput">并发数 <span class="optional">0 = 全部</span></label>
            <input id="concurrencyInput" class="input" type="number" min="0" max="500" value="0">
          </div>
          <div class="field">
            <label for="retryInput">每账号重试</label>
            <input id="retryInput" class="input" type="number" min="1" max="100" value="5">
          </div>
          <div class="field">
            <label for="timeoutInput">轮询秒数</label>
            <input id="timeoutInput" class="input" type="number" min="5" max="600" value="45">
          </div>
          <div class="field">
            <label for="startIntervalInput">启动间隔</label>
            <input id="startIntervalInput" class="input" type="number" min="0" max="60" step="0.1" value="1">
          </div>
        </div>

        <details class="advanced">
          <summary>高级设置</summary>
          <div class="advanced-body">
            <div class="field">
              <label for="intervalInput">轮询间隔 ms</label>
              <input id="intervalInput" class="input" type="number" min="100" max="10000" value="1000">
            </div>
            <label class="check-field" for="diagnosticsInput">
              <input id="diagnosticsInput" type="checkbox">
              <span>保存协议诊断</span>
            </label>
          </div>
        </details>

        <p id="formError" class="form-error" role="alert" hidden></p>
        <div class="actions">
          <button id="startButton" class="button button-primary" type="submit">开始批量提链</button>
          <button id="stopButton" class="button button-danger" type="button" disabled>停止整批</button>
        </div>
      </form>
    </section>

    <section class="output-panel" aria-label="批量任务输出">
      <div class="results-panel">
        <div class="results-header">
          <div>
            <h2>批量结果</h2>
            <span id="taskId" class="field-meta mono"></span>
          </div>
          <div class="result-tools">
            <button id="copySuccessButton" class="button button-small" type="button" disabled>复制成功链接</button>
            <a id="exportButton" class="button button-small" href="/api/results.csv">导出 CSV</a>
          </div>
        </div>

        <div class="stats" aria-label="批量统计">
          <div class="stat"><strong id="statTotal">0</strong><span>总数</span></div>
          <div class="stat"><strong id="statCompleted">0</strong><span>已完成</span></div>
          <div class="stat stat-success"><strong id="statSuccess">0</strong><span>成功</span></div>
          <div class="stat stat-failed"><strong id="statFailed">0</strong><span>失败</span></div>
        </div>

        <div class="progress-track" aria-hidden="true">
          <span id="progressFill"></span>
        </div>

        <div class="table-wrap">
          <table class="result-table">
            <thead>
              <tr><th>#</th><th>账号</th><th>状态</th><th>结果</th><th></th></tr>
            </thead>
            <tbody id="resultBody">
              <tr id="emptyResult"><td colspan="5" class="empty-cell">等待任务开始</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="log-panel">
        <div class="log-header">
          <div>
            <h2>账号日志</h2>
            <span id="accountLogLabel" class="field-meta mono">选择一个账号</span>
          </div>
          <button id="clearButton" class="text-button" type="button">清空</button>
        </div>
        <div id="logList" class="log-list" aria-live="polite">
          <div class="empty-log">选择账号后查看日志</div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
