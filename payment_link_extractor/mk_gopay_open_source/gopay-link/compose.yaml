services:
  gopay-link:
    build:
      context: ..
      dockerfile: gopay-link/Dockerfile
    container_name: gopay-link
    restart: unless-stopped
    ports:
      - "8791:8791"
    volumes:
      - gopay-link-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  gopay-link-data:
